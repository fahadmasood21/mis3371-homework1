<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header">
    <div class="header-left">
      <img src="logo.png" alt="Clinic Logo" class="logo" />
      <div>
        <h1>PrimeCare Medical</h1>
        <p class="tagline">Patient Registration Form</p>
      </div>
    </div>

    <div class="header-right">
      <p class="today-line">
        today is:
        <span id="todayText"></span>
      </p>
    </div>
  </div>

  <div id="content">
    <h2>Thank you for your submission.</h2>
    <p class="helper-text">Your information has been received (client-side demo).</p>
    <p><a href="patient-form.html">Back to the form</a></p>
  </div>

  <div id="footer">
    <div class="footer-left">
      <strong>WeRDocs Medical</strong><br />
      PO BOX 18881<br />
      Sugar Land TX 77496
    </div>

    <div class="footer-mid">
      <a href="#" class="footer-link">CONTACT US</a>
      <div class="footer-note">(link can be wired later)</div>
    </div>

    <div class="footer-right">
      <a href="#" class="footer-link">FB</a>
      <a href="#" class="footer-link">Twitter</a>
      <a href="#" class="footer-link">Other</a>
    </div>
  </div>

  <script>
    const d = new Date();
    const opts = { weekday: "long", year: "numeric", month: "short", day: "numeric" };
    document.getElementById("todayText").textContent = d.toLocaleDateString("en-US", opts);
  </script>
</body>
</html>
